plugins {
    id "com.android.application"
}

android {
    namespace "net.polze.adolarradio"
    compileSdk 35

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        // Keep Adolar Next independently installable alongside the existing
        // Adolar Radio app. The Java namespace intentionally stays stable
        // while the new product is developed.
        applicationId "net.polze.adolarnext"
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName "0.1.0-next"
    }
}

dependencies {
    implementation "androidx.media:media:1.8.0"
    // 1.9.4 is the newest stable Media3 line compatible with this app's API 35 toolchain.
    implementation "androidx.media3:media3-exoplayer:1.9.4"
    implementation "androidx.media3:media3-common:1.9.4"
    implementation "androidx.media3:media3-datasource:1.9.4"
    implementation "androidx.media3:media3-database:1.9.4"
}
