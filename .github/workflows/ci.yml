name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Keep CI reproducible instead of silently following the announced
    # ubuntu-latest migration to Ubuntu 26.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          # Matches the python:3.12-slim deployment image.
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        # ruff is pinned so local runs and CI agree on the rule set.
        run: pip install -r requirements.txt pytest ruff==0.16.0
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest -q
